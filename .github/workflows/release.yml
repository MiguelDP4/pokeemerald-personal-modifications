name: Build and Release ROM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Versión para el Release (ej: v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_title:
        description: 'Título del Release'
        required: false
        default: 'Pokémon Emerald (Personal Mod)'
        type: string
      release_notes:
        description: 'Notas o descripción del Release'
        required: false
        default: 'Compilación automatizada de pokeemerald.gba con mejoras de calidad de vida y personalización de color de atuendo.'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compile ROM and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          path: agbcc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev build-essential git

      - name: Build and install agbcc
        working-directory: agbcc
        run: |
          ./build.sh
          ./install.sh ../
          cd ..
          rm -rf agbcc

      - name: Compile ROM
        run: |
          make -j$(nproc)

      - name: Verify ROM generated
        run: |
          if [ ! -f pokeemerald.gba ]; then
            echo "::error::No se pudo encontrar pokeemerald.gba tras la compilación."
            exit 1
          fi
          ls -lh pokeemerald.gba

      - name: Determine Release Metadata
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            TITLE="${{ inputs.release_title }}"
            NOTES="${{ inputs.release_notes }}"
            if [ -z "$TITLE" ]; then
              TITLE="Release $TAG"
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Release $TAG"
            NOTES="Compilación automática para el tag $TAG."
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "notes=$NOTES" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-${{ steps.vars.outputs.tag }}
          path: pokeemerald.gba

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          body: ${{ steps.vars.outputs.notes }}
          draft: false
          prerelease: false
          files: pokeemerald.gba
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
